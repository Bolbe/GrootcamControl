name: Build release packages

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  ubuntu:
    uses: Bolbe/github-build-tools/.github/workflows/build-qt-app-linux.yml@main
    with:
      app_name: GrootcamControl
      artifact_name: grootcamcontrol

  release-ubuntu:
    needs: ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: grootcamcontrol-linux
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GrootcamControl ${{ github.run_number }}
          files: dist/**

