name: Build Applications

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which build to run'
        required: true
        default: 'linux-dynamic'
        type: choice
        options:
          - linux-dynamic
          - linux-static
          - macos-static-x86_64
          - macos-static-arm64
          - macos
          - windows

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    if: ${{ inputs.target == 'linux-dynamic' }}
    uses: Bolbe/github-build-tools/.github/workflows/build-app-dynamic-linux.yml@main
    with:
      app_name: GrootcamControl
      artifact_name: grootcamcontrol
